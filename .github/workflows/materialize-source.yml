name: Materialize full Octo source
# Re-run from latest main so source replacement is a fast-forward

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Gusonic repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve Gusonic patch
        run: cp apply_gusonic_playlists.py /tmp/apply_gusonic_playlists.py

      - name: Fetch pinned upstream source
        run: |
          git clone https://github.com/winters27/octo.git /tmp/octo-upstream
          cd /tmp/octo-upstream
          git checkout 2579262a5d5ac9ed0b8a11c208e71e5059d71d95

      - name: Replace overlay with complete upstream source
        run: |
          rsync -a --delete             --exclude='.git'             --exclude='.github/'             /tmp/octo-upstream/ ./

      - name: Apply Gusonic playlist implementation directly to source
        run: python3 /tmp/apply_gusonic_playlists.py .

      - name: Add Gusonic project notes
        run: |
          cat > GUSONIC.md <<'EOF'
          # Gusonic Octo modifications

          This repository contains the complete Octo 2026.09.14 source tree with
          Gusonic-specific changes applied directly to the C# source.

          Upstream base:

          - Repository: https://github.com/winters27/octo
          - Commit: 2579262a5d5ac9ed0b8a11c208e71e5059d71d95
          - Release: 2026.09.14

          Gusonic changes:

          - Deezer public playlist search via the metadata API.
          - External playlist detail and track-list retrieval.
          - Playlist tracks are converted into normal Octo external placeholders.
          - Playback therefore remains YouTube-based.
          - Heart/acquisition remains Soulseek/Lidarr-based.
          - No Deezer ARL is required for playlist discovery.
          - External playlists are surfaced through Subsonic search as albums with
            genre "Playlist", matching the existing compatibility layer used by
            clients such as Arpeggi.

          The upstream GPL-3.0 license is preserved.
          EOF

      - name: Add source-level modification notice to README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          upstream = p.read_text()
          banner = """# Gusonic Octo

          > **Modified Octo build.** This repository contains the complete source of
          > Octo 2026.09.14 with Gusonic's Deezer playlist discovery integrated
          > directly into the C# code. See [GUSONIC.md](GUSONIC.md) for the exact
          > changes and upstream revision.

          ---

          """
          p.write_text(banner + upstream)
          PY

      - name: Commit complete source tree
        run: |
          git config user.name "GustavoCou"
          git config user.email "128309041+GustavoCou@users.noreply.github.com"
          git add -A
          git commit -m "refactor: materialize full Octo source with Gusonic playlist support"
          git push origin main
